<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151517" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icon.svg" />
<link rel="apple-touch-icon" href="./icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DSH 远控" />
<title>DSH 远控</title>
<style>
  /* Palette lifted from the Desktop Harness dark theme (dsh-client-ui-theme):
     bg-base=neutral-bluish-950 #151517, layer-1=-875 #232324, layer-2=-850 #2c2c2e,
     layer-3=-800 #353638, label-primary=-50 #f9fafb, secondary=-300 #cfd3d6,
     tertiary=-400 #adb2b8, caption=-600 #81858c. */
  :root {
    --bg-base: #151517;
    --bg-layer-1: #232324;
    --bg-layer-2: #2c2c2e;
    --bg-layer-3: #353638;
    --label-primary: #f9fafb;
    --label-secondary: #cfd3d6;
    --label-tertiary: #adb2b8;
    --label-caption: #81858c;
    --border-l1: #ffffff0f;
    --border-l2: #ffffff1f;
    --hover: #ffffff14;
    --success: #22c55e;
    --warn: #f59e0b;
    --error: #ef4444;
    --brand: #f9fafb;
    --brand-fg: #151517;
    --sidebar: 268px;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-base); color: var(--label-primary);
    font: 15px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  textarea { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100%; }

  /* ── sidebar ─────────────────────────────────────────────── */
  .sidebar {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--bg-layer-1); border-right: 1px solid var(--border-l1);
  }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  .side-actions { padding: 0 12px 8px; }
  .side-actions button {
    width: 100%; padding: 8px 10px; border-radius: 9px; font-size: 13px;
    color: var(--label-secondary); border: 1px solid var(--border-l2); background: transparent;
  }
  .side-actions button:hover { background: var(--hover); }
  .session-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
  .group { margin-top: 10px; }
  .group-title {
    font-size: 11px; color: var(--label-caption); padding: 6px 8px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  .sess {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 10px; margin-bottom: 2px;
  }
  .sess:hover { background: var(--hover); }
  .sess[aria-current="true"] { background: var(--bg-layer-2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label-caption); flex: none; }
  .dot[data-tone="running"] { background: var(--success); box-shadow: 0 0 0 3px #22c55e22; }
  .dot[data-tone="asking"] { background: var(--warn); box-shadow: 0 0 0 3px #f59e0b22; }
  .sess .body { min-width: 0; flex: 1; }
  .sess .t { font-size: 13px; color: var(--label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess[aria-current="true"] .t { color: var(--label-primary); }
  .sess .when { font-size: 11px; color: var(--label-caption); margin-top: 1px; }
  .side-foot {
    border-top: 1px solid var(--border-l1); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border-l2); color: var(--label-tertiary); white-space: nowrap;
  }
  .badge[data-tone="ok"] { background: #22c55e1f; border-color: #22c55e55; color: #7ee2a8; }
  .badge[data-tone="warn"] { background: #f59e0b1a; border-color: #f59e0b55; color: #f3c274; }
  .badge[data-tone="err"] { background: #ef44441a; border-color: #ef444455; color: #f09a9a; }
  .link-btn { margin-left: auto; font-size: 12px; color: var(--label-caption); }
  .link-btn:hover { color: var(--label-secondary); }

  /* ── main ────────────────────────────────────────────────── */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-base); }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border-l1);
  }
  .titles { min-width: 0; flex: 1; }
  .title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 11px; color: var(--label-caption); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { padding: 6px 9px; border-radius: 8px; color: var(--label-tertiary); font-size: 15px; }
  .icon-btn:hover { background: var(--hover); }
  .ghost-btn {
    padding: 6px 11px; border-radius: 8px; font-size: 12px;
    color: var(--label-tertiary); border: 1px solid var(--border-l1); flex: none;
  }
  .ghost-btn:hover { background: var(--hover); color: var(--label-secondary); }

  .feed { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px 28px; }
  .feed-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .turn { display: flex; flex-direction: column; gap: 4px; }
  .turn.user { align-items: flex-end; }
  .turn.user .bubble {
    background: var(--bg-layer-2); border: 1px solid var(--border-l1);
    padding: 10px 14px; border-radius: 14px; max-width: 85%;
    white-space: pre-wrap; word-break: break-word;
  }
  .turn.assistant .bubble { white-space: pre-wrap; word-break: break-word; color: var(--label-primary); }
  .tool {
    font: 12px/1.55 var(--mono); color: var(--label-tertiary);
    border-left: 2px solid var(--border-l2); padding: 2px 0 2px 10px;
    white-space: pre-wrap; word-break: break-word;
  }
  .tool[data-phase="completed"] { border-left-color: #22c55e88; }
  .tool[data-phase="failed"] { border-left-color: #ef444488; }
  .note { font-size: 12px; color: var(--label-caption); }
  .note[data-tone="warn"] { color: #f3c274; }
  .note[data-tone="err"] { color: #f09a9a; }

  .card {
    border: 1px solid #f59e0b55; background: #f59e0b12; border-radius: var(--radius);
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .card.question { border-color: #60a5fa55; background: #60a5fa10; }
  .card h3 { margin: 0; font-size: 13px; color: var(--label-primary); }
  .card p { margin: 0; font-size: 13px; color: var(--label-secondary); white-space: pre-wrap; }
  .card .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .card button {
    padding: 7px 13px; border-radius: 9px; font-size: 13px;
    border: 1px solid var(--border-l2); color: var(--label-primary); background: transparent;
  }
  .card button:hover { background: var(--hover); }
  .card button.sel { background: var(--brand); color: var(--brand-fg); border-color: transparent; }
  .card input[type="text"] {
    width: 100%; padding: 9px 12px; border-radius: 9px; font-size: 14px;
    background: var(--bg-base); border: 1px solid var(--border-l2); color: var(--label-primary);
  }

  .composer {
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-l1);
  }
  .composer[hidden] { display: none; }
  .composer-inner {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg-layer-1); border: 1px solid var(--border-l2); border-radius: 14px; padding: 10px 12px;
  }
  .composer-inner:focus-within { border-color: #ffffff40; }
  .composer textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent;
    min-height: 24px; max-height: 30vh; line-height: 1.55;
  }
  .composer textarea::placeholder { color: var(--label-caption); }
  .composer .primary {
    flex: none; padding: 7px 15px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--brand); color: var(--brand-fg);
  }
  .composer .primary:disabled { opacity: .45; }
  .keyhint { font-size: 11px; color: var(--label-caption); text-align: center; margin-top: 6px; }

  .logs {
    border-top: 1px solid var(--border-l1); background: #101011;
    max-height: 26vh; overflow-y: auto; padding: 8px 16px;
    font: 11px/1.55 var(--mono); color: var(--label-caption);
  }
  .logs[hidden] { display: none; }
  .logs div[data-level="warn"] { color: #f3c274; }
  .logs div[data-level="error"] { color: #f09a9a; }

  /* ── pairing overlay ─────────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: #000000a8; padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    width: min(560px, 100%); background: var(--bg-layer-1); border: 1px solid var(--border-l2);
    border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 24px 64px #00000080;
  }
  .sheet h2 { margin: 0; font-size: 15px; }
  .sheet p { margin: 0; font-size: 12px; color: var(--label-tertiary); line-height: 1.6; }
  .sheet code { background: var(--bg-layer-3); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  .sheet textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border-radius: 10px;
    background: var(--bg-base); border: 1px solid var(--border-l2); color: var(--label-primary);
    font: 12px/1.5 var(--mono);
  }
  .sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sheet button {
    padding: 9px 16px; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--border-l2); color: var(--label-primary); background: transparent;
  }
  .sheet button.primary { background: var(--brand); color: var(--brand-fg); border-color: transparent; font-weight: 600; }
  .sheet button:disabled { opacity: .45; }

  .scrim { display: none; }

  /* ── narrow screens: the sidebar becomes a drawer ────────── */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(84vw, var(--sidebar));
      transform: translateX(-100%); transition: transform .22s ease; box-shadow: 0 0 40px #000000aa;
    }
    body.drawer-open .sidebar { transform: none; }
    body.drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 20; background: #00000066; }
    .feed { padding: 16px 14px 22px; }
    .composer { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
  }
  @media (min-width: 821px) {
    #openSidebar, #closeSidebar { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand">DSH 远控</div>
      <button id="closeSidebar" class="icon-btn" style="margin-left:auto" aria-label="收起">✕</button>
    </div>
    <div class="side-actions">
      <button id="refresh">刷新会话</button>
    </div>
    <nav class="session-list" id="sessions"></nav>
    <div class="side-foot">
      <span id="status" class="badge" data-tone="warn">未连接</span>
      <button id="forget" class="link-btn">清除配对</button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="openSidebar" aria-label="会话列表">☰</button>
      <div class="titles">
        <div class="title" id="sessionTitle">未选择会话</div>
        <div class="meta" id="sessionMeta">连接后从会话列表里选一个</div>
      </div>
      <button class="ghost-btn" id="interrupt">中断</button>
      <button class="ghost-btn" id="toggleLogs">日志</button>
    </header>

    <section class="feed" id="feed">
      <div class="feed-inner" id="feedInner"></div>
    </section>

    <div class="composer" id="composer" hidden>
      <div class="composer-inner">
        <textarea id="prompt" rows="1" placeholder="给 DSH 下命令…"></textarea>
        <button class="primary" id="send">发送</button>
      </div>
      <div class="keyhint">Ctrl / ⌘ + Enter 发送</div>
    </div>

    <div class="logs" id="logs" hidden></div>
  </main>
</div>

<div class="overlay" id="pairPanel" hidden>
  <div class="sheet">
    <h2>配对这台主机</h2>
    <p>在电脑上运行 <b>pair.cmd</b>，把打印出的 <code>dshr:/p?…</code> 整行粘贴到下面。手机也可以先扫电脑屏幕上的二维码，再把识别出的文本粘贴进来。</p>
    <textarea id="uri" spellcheck="false" placeholder="dshr:/p?v=1&s=wss://drc.provid.cc&n=dsh-host&psk=…&t=123456"></textarea>
    <p id="pairError" style="color:#f09a9a" hidden></p>
    <div class="row">
      <button class="primary" id="connect">连接并配对</button>
      <button id="dismiss">稍后</button>
    </div>
  </div>
</div>

<script src="./vendor/nacl-fast.js"></script>
<script type="module" src="./app/app.js"></script>
</body>
</html>
